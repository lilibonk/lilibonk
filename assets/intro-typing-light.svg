<!-- https://github.com/DenverCoder1/readme-typing-svg/ -->
<svg xmlns='http://www.w3.org/2000/svg'
    xmlns:xlink='http://www.w3.org/1999/xlink'
    viewBox='0 0 480 32'
    style='background-color: #00000000;'
    width='480px' height='32px'>

    <style>
@font-face {
  font-family: 'Fira Code';
  font-style: normal;
  font-weight: 500;
  font-display: fallback;
  src: url(data:font/truetype;base64,) format('truetype');
}
</style>

                <path id='path0'>
                            <!-- Single line -->
                                <animate id='d0' attributeName='d' begin='0s;d2.end'
                    dur='4400ms' fill='remove'
                    values='m0,16 h0 ; m0,16 h480 ; m0,16 h480 ; m0,16 h0' keyTimes='0;0.50909090909091;0.87272727272727;1' />
                    </path>
    <text font-family='"Fira Code", monospace' fill='#B98232' font-size='18'
        dominant-baseline='middle'
        x='0%' text-anchor='start'
        letter-spacing='normal'>
        <textPath xlink:href='#path0'>
            Build useful things.
        </textPath>
    </text>
        <path id='path1'>
                            <!-- Single line -->
                                <animate id='d1' attributeName='d' begin='d0.end'
                    dur='4400ms' fill='remove'
                    values='m0,16 h0 ; m0,16 h480 ; m0,16 h480 ; m0,16 h0' keyTimes='0;0.50909090909091;0.87272727272727;1' />
                    </path>
    <text font-family='"Fira Code", monospace' fill='#B98232' font-size='18'
        dominant-baseline='middle'
        x='0%' text-anchor='start'
        letter-spacing='normal'>
        <textPath xlink:href='#path1'>
            Explore agent workflows.
        </textPath>
    </text>
        <path id='path2'>
                            <!-- Single line -->
                                <animate id='d2' attributeName='d' begin='d1.end'
                    dur='4400ms' fill='remove'
                    values='m0,16 h0 ; m0,16 h480 ; m0,16 h480 ; m0,16 h0' keyTimes='0;0.50909090909091;0.87272727272727;1' />
                    </path>
    <text font-family='"Fira Code", monospace' fill='#B98232' font-size='18'
        dominant-baseline='middle'
        x='0%' text-anchor='start'
        letter-spacing='normal'>
        <textPath xlink:href='#path2'>
            Keep a little room for play.
        </textPath>
    </text>
</svg>
